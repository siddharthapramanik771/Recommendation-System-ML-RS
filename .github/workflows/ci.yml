name: Recommender CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  train-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Compile source
        run: python -m compileall app src streamlit_app.py

      - name: Train on sample data
        run: |
          python -m src.train --sample --epochs 2 --factors 8 --k-values 5,10

