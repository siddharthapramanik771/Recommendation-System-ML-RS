name: Recommender CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  train-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Compile source
        run: python -m compileall app src streamlit_app.py

      - name: Train on sample data
        env:
          RECOMMENDER_TRAINING_SOURCE: sample
          RECOMMENDER_EPOCHS: "2"
          RECOMMENDER_LATENT_FACTORS: "8"
          RECOMMENDER_K_VALUES: "5,10"
        run: python -m src.train
