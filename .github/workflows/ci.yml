name: Recommender CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/model.joblib"
      - "models/training_metrics.json"
      - "data/tmdb/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-tmdb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Compile source
        run: python -m compileall app src streamlit_app.py

      - name: Train on TMDB data
        env:
          RECOMMENDER_TRAINING_SOURCE: tmdb
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          TMDB_PAGES: "1"
          RECOMMENDER_EPOCHS: "2"
          RECOMMENDER_LATENT_FACTORS: "8"
          RECOMMENDER_K_VALUES: "5,10"
        run: python -m src.train

      - name: Save trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recommender-ci-model-${{ github.run_id }}
          path: |
            models/model.joblib
            models/training_metrics.json
            data/tmdb/ratings.csv
            data/tmdb/movies.csv
            data/tmdb/links.csv
          retention-days: 14

      - name: Commit trained model
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model.joblib models/training_metrics.json
          git add -f data/tmdb/ratings.csv data/tmdb/movies.csv data/tmdb/links.csv
          git diff --cached --quiet || git commit -m "Update TMDB recommender model [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
