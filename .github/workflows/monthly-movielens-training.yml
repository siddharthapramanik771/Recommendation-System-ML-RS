name: Monthly MovieLens Training

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-movielens:
    runs-on: ubuntu-latest
    env:
      RECOMMENDER_TRAINING_SOURCE: csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Compile source
        run: python -m compileall app src streamlit_app.py

      - name: Train from MovieLens data
        run: python -m src.train

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recommender-model-${{ github.run_id }}
          path: |
            models/model.joblib
            models/training_metrics.json
          retention-days: 90

      - name: Commit refreshed model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model.joblib models/training_metrics.json
          git diff --cached --quiet || git commit -m "Update monthly MovieLens recommender model [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
